aid: david-protein
name: David Protein
description: 'David is a New York nutrition company founded in 2023 by RXBAR co-founder
  Peter Rahal, selling high-protein bars (28g protein, 150 calories, 0g sugar), the
  Bronze and Gold bar lines, and protein ice cream pints direct-to-consumer, through
  wholesale, and in retail. David runs no developer program and publishes no OpenAPI,
  but its Shopify-hosted storefront at davidprotein.com serves a complete agent-commerce
  surface from its own hostnames: an agents.md / llms.txt instruction document, a Universal
  Commerce Protocol (UCP) merchant profile at /.well-known/ucp, OAuth 2.0 and OpenID
  Connect discovery documents, and three live Model Context Protocol servers covering
  catalog search, product lookup, cart, checkout, shop policy Q&A, order status and
  returns.'
image: https://davidprotein.com/cdn/shop/files/Group_524_4.png?v=1776707158
url: https://raw.githubusercontent.com/api-evangelist/david-protein/refs/heads/main/apis.yml
